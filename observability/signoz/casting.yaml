apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  patches:
    - target: deployment/compose.yaml
      operations:
        - op: replace
          path: /services/signoz-signoz-0/ports/0
          value: "7117:8080"
        - op: replace
          path: /services/ingester/command
          value:
            - -c
            - |
              /signoz-otel-collector migrate sync check &&
              /signoz-otel-collector --config=/etc/otel-collector-config.yaml
        - op: add
          path: /services/signoz-telemetrystore-clickhouse-user-scripts/environment
          value:
            - HTTP_PROXY=http://host.docker.internal:3128
            - HTTPS_PROXY=http://host.docker.internal:3128
            - http_proxy=http://host.docker.internal:3128
            - https_proxy=http://host.docker.internal:3128
            - NO_PROXY=localhost,127.0.0.1,::1
            - no_proxy=localhost,127.0.0.1,::1
        - op: add
          path: /services/signoz-telemetrystore-clickhouse-user-scripts/extra_hosts
          value:
            - host.docker.internal:host-gateway
        - op: add
          path: /services/signoz-runtime-recycler
          value:
            image: "${HR_AGENT_BACKEND_IMAGE:-06-emotion-main-backend:local}"
            container_name: signoz-runtime-recycler
            command:
              - python
              - -m
              - backend.services.signoz_runtime_recycler
            environment:
              SIGNOZ_AUTO_RECYCLE_ENABLED: "${SIGNOZ_AUTO_RECYCLE_ENABLED:-true}"
              SIGNOZ_APP_PROJECT_NAME: "${SIGNOZ_APP_PROJECT_NAME:-06-emotion-main}"
              SIGNOZ_PROJECT_NAME: "${SIGNOZ_PROJECT_NAME:-signoz}"
              SIGNOZ_DOCKER_SOCKET_PATH: /var/run/docker.sock
              SIGNOZ_IDLE_TTL_SECONDS: "${SIGNOZ_IDLE_TTL_SECONDS:-900}"
              SIGNOZ_RECYCLE_CHECK_INTERVAL_SECONDS: "${SIGNOZ_RECYCLE_CHECK_INTERVAL_SECONDS:-10}"
              SIGNOZ_START_TIMEOUT_SECONDS: "${SIGNOZ_START_TIMEOUT_SECONDS:-180}"
              SIGNOZ_HEALTH_POLL_INTERVAL_SECONDS: "${SIGNOZ_HEALTH_POLL_INTERVAL_SECONDS:-2}"
              SIGNOZ_STOP_TIMEOUT_SECONDS: "${SIGNOZ_STOP_TIMEOUT_SECONDS:-30}"
            networks:
              - signoz-network
            restart: unless-stopped
            security_opt:
              - no-new-privileges:true
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
              - ../../../../backend:/app/backend:ro
