resolver 127.0.0.11 valid=5s ipv6=off;

map $cookie_hragent_session $backend_affinity_key {
  default $cookie_hragent_session;
  "" $remote_addr;
}

map $http_upgrade $frontend_connection_upgrade {
  default upgrade;
  "" close;
}

upstream backend_cluster {
  zone backend_cluster 64k;
  # The speech WebSocket hub is process-local. Keep every authenticated
  # user's WebSocket and POST/SSE requests on the same backend replica.
  hash $backend_affinity_key consistent;
  server backend:7111 resolve;
  keepalive 128;
}

server {
  listen 7070;
  listen [::]:7070;
  server_name _;

  return 308 https://${FRONTEND_HTTPS_HOST}:${FRONTEND_HTTPS_PORT}$request_uri;
}

server {
  listen 7443 ssl;
  listen [::]:7443 ssl;
  http2 on;
  client_max_body_size 64m;
  server_name ${FRONTEND_HTTPS_HOST};

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_session_timeout 1d;
  ssl_session_cache shared:FrontendSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;
  sendfile on;
  tcp_nopush on;
  etag on;
  open_file_cache max=2048 inactive=60s;
  open_file_cache_valid 120s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

  # Dynamic backend replicas enter and leave Docker DNS at runtime. Retry only
  # connection/upstream failures; Nginx still does not replay a non-idempotent
  # request after it has been sent to an upstream.
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 3;

  # In development, only browser assets move to Vite. Nginx continues to own
  # TLS, runtime config, API routing, long-lived streams, and session affinity.
  set $frontend_runtime_mode "${APP_RUNTIME_MODE}";
  set $frontend_dev_upstream "http://frontend_dev:8080";
  error_page 418 = @frontend_dev;

  location = /runtime-config.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, max-age=0" always;
    return 200 'window.__HR_AGENT_RUNTIME_CONFIG__ = Object.freeze({ workflowPageGuideEnabled: "${WORKFLOW_PAGE_GUIDE_ENABLED}", workflowPageGuideAlwaysShow: "${WORKFLOW_PAGE_GUIDE_ALWAYS_SHOW}", agentIntroductionVariant: "${AGENT_INTRODUCTION_VARIANT}" });';
  }

  location = /api/v1/asr/realtime {
    proxy_pass http://backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 960s;
    proxy_read_timeout 960s;
    send_timeout 960s;
    proxy_buffering off;
  }

  # The compatibility upload endpoint has no total recording-size limit. Nginx
  # and Backend stream its body; realtime recording continues to use WebSocket.
  location = /api/v1/asr/transcribe {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_pass http://backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;
    send_timeout 86400s;
    proxy_buffering off;
  }

  location = /api/v1/rehearsal/speech/realtime {
    proxy_pass http://backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;
    send_timeout 86400s;
    proxy_buffering off;
  }

  location /api/v1/ {
    proxy_pass http://backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A dead/scaled-down replica must fail fast so Nginx can retry another
    # healthy backend; the long read/send timeouts still protect SSE streams.
    proxy_connect_timeout 15s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;
    send_timeout 86400s;
    proxy_buffering off;
  }

  location / {
    if ($frontend_runtime_mode = development) {
      return 418;
    }
    add_header Cache-Control "no-store";
    add_header Permissions-Policy "microphone=(self)" always;
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    if ($frontend_runtime_mode = development) {
      return 418;
    }
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
    access_log off;
  }

  location @frontend_dev {
    proxy_pass $frontend_dev_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $frontend_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;
    proxy_buffering off;
    # Preserve Vite's cache policy: source/HTML revalidate with ETag, while
    # versioned dependency modules stay cached across reloads. HMR remains live.
    add_header Permissions-Policy "microphone=(self)" always;
  }
}
