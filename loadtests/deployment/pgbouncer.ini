[databases]
hr_agent_loadtest = host=postgres port=7214 dbname=hr_agent_loadtest user=hr_agent password=hr_agent pool_size=256 reserve_pool_size=64 max_db_connections=320

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 4000
default_pool_size = 256
reserve_pool_size = 64
reserve_pool_timeout = 3
max_db_connections = 320
max_user_connections = 320
max_prepared_statements = 100
server_connect_timeout = 15
server_login_retry = 1
query_wait_timeout = 120
client_idle_timeout = 0
server_idle_timeout = 600
server_lifetime = 3600
stats_period = 60
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
admin_users = hr_agent
stats_users = hr_agent
