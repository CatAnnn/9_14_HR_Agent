x-host-proxy-environment: &host-proxy-environment
  HTTP_PROXY: http://host.docker.internal:3128
  HTTPS_PROXY: http://host.docker.internal:3128
  http_proxy: http://host.docker.internal:3128
  https_proxy: http://host.docker.internal:3128

x-tls-client-environment: &tls-client-environment
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt

x-model-download-environment: &model-download-environment
  <<: [*host-proxy-environment, *tls-client-environment]
  HF_HUB_DISABLE_XET: "1"

x-postgres-client-environment: &postgres-client-environment
  DATABASE_URL: postgresql://hr_agent:hr_agent@postgres:7114/hr_agent
  DATABASE_ADMIN_URL: postgresql://hr_agent:hr_agent@postgres:7114/hr_agent
  POSTGRES_AUTO_INITIALIZE_SCHEMA: "false"
  POSTGRES_POOL_MIN_SIZE: "1"
  POSTGRES_POOL_MAX_SIZE: "16"

x-otel-exporter-environment: &otel-exporter-environment
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${ENVIRONMENT:-local},service.version=${OTEL_SERVICE_VERSION:-0.5.0-postgres-pgvector}"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz_collection_agent:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  OTEL_METRIC_EXPORT_INTERVAL: "30000"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta

x-fish-tts-build: &fish-tts-build
  context: .
  dockerfile: fish_tts/Dockerfile
  extra_hosts:
    - "host.docker.internal:host-gateway"
  args:
    HTTP_PROXY: http://host.docker.internal:3128
    HTTPS_PROXY: http://host.docker.internal:3128
    NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal

x-qwen-vllm-build: &qwen-vllm-build
  context: .
  dockerfile: deployment/vllm/Dockerfile.v0.8.5-no-xet

services:
  postgres:
    image: tensorchord/vchord-suite:pg16-20260501@sha256:65b98b5aa96507d3d8aa61c5a0ed7d333828f128a72cefd9de677efe92712277
    restart: unless-stopped
    # HNSW index maintenance uses PostgreSQL dynamic shared memory. Docker's
    # 64 MiB default is smaller than one maintenance_work_mem allocation and
    # makes backend startup sync fail with a misleading DiskFull error.
    shm_size: "1g"
    environment:
      POSTGRES_DB: hr_agent
      POSTGRES_USER: hr_agent
      POSTGRES_PASSWORD: hr_agent
      PGPORT: "7114"
    command:
      - postgres
      - -c
      - port=7114
      - -c
      - max_connections=1020
      - -c
      - superuser_reserved_connections=10
      - -c
      - shared_preload_libraries=vchord,vchord_bm25,vector,pg_tokenizer
      - -c
      - 'search_path="$$user", public, bm25_catalog, tokenizer_catalog'
    ports:
      - "7114:7114"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U hr_agent -d hr_agent -p 7114 &&
          test "$$(psql -U hr_agent -d hr_agent -p 7114 -Atqc 'SHOW max_connections')" -eq 1020
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  pgbouncer:
    image: percona/percona-pgbouncer:1.25.2-4-amd64@sha256:8d34761507b36840ecfe3d42e32a4a333d6c5a973703dd648203b135f02ac9d0
    platform: linux/amd64
    entrypoint: ["/usr/bin/pgbouncer"]
    command: ["/etc/pgbouncer/pgbouncer.ini"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deployment/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./deployment/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    expose:
      - "6432"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/6432'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mineru:
    # Knowledge-base parsing is a maintenance workflow, not an online dependency.
    profiles: ["knowledge-build"]
    restart: unless-stopped
    build:
      # The MinerU image installs only published packages and does not copy the
      # application repository. Keeping this context local avoids sending the
      # entire workspace to BuildKit for every image rebuild.
      context: ./mineru_service
      dockerfile: Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        HTTP_PROXY: http://host.docker.internal:3128
        HTTPS_PROXY: http://host.docker.internal:3128
        NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "32g"
    ipc: host
    gpus:
      - driver: nvidia
        device_ids: ["${MINERU_GPU_DEVICE:-0}"]
        capabilities: [gpu]
    environment:
      # Reuse the same proxy/TLS-safe Hugging Face download settings as the
      # other local model services.  Xet's Rust TLS client cannot validate the
      # corporate proxy certificate and otherwise stalls VLM preload.
      <<: *model-download-environment
      NO_PROXY: localhost,127.0.0.1,::1,backend,frontend,postgres,redis,mineru,qwen_embedding,qwen_reranker,qwen3_asr,qwen3_asr_secondary,fish_tts
      no_proxy: localhost,127.0.0.1,::1,backend,frontend,postgres,redis,mineru,qwen_embedding,qwen_reranker,qwen3_asr,qwen3_asr_secondary,fish_tts
      NVIDIA_VISIBLE_DEVICES: "${MINERU_GPU_DEVICE:-0}"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - mineru_hf_cache:/root/.cache/huggingface
      - mineru_vllm_cache:/root/.cache/vllm
    ports:
      - "7112:7112"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7112/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  qwen_embedding:
    profiles: ["local"]
    build: *qwen-vllm-build
    image: 06-emotion-qwen-vllm:v0.8.5-no-xet
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "16g"
    ipc: host
    gpus:
      - driver: nvidia
        device_ids: ["${QWEN_EMBEDDING_GPU_DEVICE:-0}"]
        capabilities: [gpu]
    environment:
      <<: [*host-proxy-environment, *tls-client-environment]
      NO_PROXY: localhost,127.0.0.1,::1,backend,frontend,postgres,redis,mineru,qwen_embedding,qwen_reranker,qwen3_asr,qwen3_asr_secondary,fish_tts
      no_proxy: localhost,127.0.0.1,::1,backend,frontend,postgres,redis,mineru,qwen_embedding,qwen_reranker,qwen3_asr,qwen3_asr_secondary,fish_tts
      NVIDIA_VISIBLE_DEVICES: "${QWEN_EMBEDDING_GPU_DEVICE:-0}"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - Qwen/Qwen3-Embedding-4B
      - --served-model-name
      - Qwen/Qwen3-Embedding-4B
      - --task
      - embed
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "${QWEN_EMBEDDING_GPU_MEMORY_UTILIZATION:-0.20}"
    volumes:
      - qwen_hf_cache:/root/.cache/huggingface
      - qwen_vllm_cache:/root/.cache/vllm
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    ports:
      - "7115:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s

  qwen_reranker:
    profiles: ["local"]
    image: vllm/vllm-openai:v0.27.1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "16g"
    ipc: host
    gpus:
      - driver: nvidia
        device_ids: ["${QWEN_RERANKER_GPU_DEVICE:-1}"]
        capabilities: [gpu]
    environment:
      <<: *model-download-environment
      NO_PROXY: localhost,127.0.0.1,::1,backend,frontend,postgres,redis,mineru,qwen_embedding,qwen_reranker,qwen3_asr,qwen3_asr_secondary,fish_tts
      no_proxy: localhost,127.0.0.1,::1,backend,frontend,postgres,redis,mineru,qwen_embedding,qwen_reranker,qwen3_asr,qwen3_asr_secondary,fish_tts
      NVIDIA_VISIBLE_DEVICES: "${QWEN_RERANKER_GPU_DEVICE:-1}"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - Qwen/Qwen3-Reranker-4B
      - --served-model-name
      - Qwen/Qwen3-Reranker-4B
      - --runner
      - pooling
      - --hf_overrides
      - '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      - --chat-template
      - /etc/vllm/qwen3_reranker.jinja
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "${QWEN_RERANK_GPU_MEMORY_UTILIZATION:-0.35}"
      - --enable-prefix-caching
      - --max-num-batched-tokens
      - "${QWEN_RERANK_MAX_NUM_BATCHED_TOKENS:-24576}"
      - --max-num-seqs
      - "${QWEN_RERANK_MAX_NUM_SEQS:-96}"
      - --dtype
      - float16
    volumes:
      - qwen_hf_cache:/root/.cache/huggingface
      - qwen_vllm_reranker_cache:/root/.cache/vllm
      - ./deployment/vllm/qwen3_reranker.jinja:/etc/vllm/qwen3_reranker.jinja:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    ports:
      - "7116:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s

  # Native /v1/rerank A/B target. This service is intentionally isolated from
  # the production qwen_reranker and starts only with --profile rerank-shadow.
  # GPU 1 must be healthy before use; do not move it to GPU 0 because that card
  # is reserved for Embedding/ASR and would invalidate throughput comparisons.
  qwen_reranker_shadow:
    profiles: ["rerank-shadow"]
    image: vllm/vllm-openai:v0.27.1
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "16g"
    ipc: host
    gpus:
      - driver: nvidia
        device_ids: ["${QWEN_RERANKER_SHADOW_GPU_DEVICE:-1}"]
        capabilities: [gpu]
    environment:
      <<: *model-download-environment
      NO_PROXY: localhost,127.0.0.1,::1,qwen_reranker_shadow
      no_proxy: localhost,127.0.0.1,::1,qwen_reranker_shadow
      NVIDIA_VISIBLE_DEVICES: "${QWEN_RERANKER_SHADOW_GPU_DEVICE:-1}"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - Qwen/Qwen3-Reranker-4B
      - --served-model-name
      - Qwen/Qwen3-Reranker-4B
      - --runner
      - pooling
      - --hf_overrides
      - '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      - --chat-template
      - /etc/vllm/qwen3_reranker.jinja
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "${QWEN_RERANK_SHADOW_GPU_MEMORY_UTILIZATION:-0.46}"
      - --max-num-batched-tokens
      - "${QWEN_RERANK_SHADOW_MAX_NUM_BATCHED_TOKENS:-16384}"
      - --max-num-seqs
      - "${QWEN_RERANK_SHADOW_MAX_NUM_SEQS:-64}"
      - --enable-prefix-caching
      - --dtype
      - float16
    volumes:
      - qwen_hf_cache:/root/.cache/huggingface
      - qwen_vllm_shadow_cache:/root/.cache/vllm
      - ./deployment/vllm/qwen3_reranker.jinja:/etc/vllm/qwen3_reranker.jinja:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    ports:
      - "127.0.0.1:${QWEN_RERANKER_SHADOW_PORT:-7123}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s

  qwen3_asr:
    profiles: ["asr-local"]
    image: qwenllm/qwen3-asr:latest@sha256:fb75b775f089e06e5a1aaebffd421e37505cc630d50c86d889d95ffa45a7e16a
    restart: unless-stopped
    depends_on:
      qwen_embedding:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "16g"
    ipc: host
    gpus:
      - driver: nvidia
        device_ids: ["${QWEN3_ASR_PRIMARY_GPU_DEVICE:-0}"]
        capabilities: [gpu]
    environment:
      <<: *model-download-environment
      NO_PROXY: localhost,127.0.0.1,::1,qwen3_asr,fish_tts
      no_proxy: localhost,127.0.0.1,::1,qwen3_asr,fish_tts
      NVIDIA_VISIBLE_DEVICES: "${QWEN3_ASR_PRIMARY_GPU_DEVICE:-0}"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - python3
      - /opt/hr-agent/run_qwen3_asr.py
      - --asr-model-path
      - Qwen/Qwen3-ASR-1.7B
      - --gpu-memory-utilization
      - "${QWEN3_ASR_GPU_MEMORY_UTILIZATION:-0.17}"
      - --max-model-len
      - "${QWEN3_ASR_MAX_MODEL_LEN:-2048}"
      - --max-num-seqs
      - "${ASR_LOCAL_PREVIEW_MAX_CONCURRENCY:-10}"
      - --max-sessions
      - "${ASR_LOCAL_PREVIEW_MAX_SESSIONS:-16}"
      - --max-new-tokens
      - "${QWEN3_ASR_MAX_NEW_TOKENS:-256}"
      - --soft-window-seconds
      - "${ASR_LOCAL_STREAM_SOFT_WINDOW_SECONDS:-12}"
      - --window-seconds
      - "${ASR_LOCAL_STREAM_WINDOW_SECONDS:-20}"
      - --overlap-seconds
      - "${ASR_LOCAL_STREAM_OVERLAP_SECONDS:-1.5}"
      - --batch-wait-ms
      - "${QWEN3_ASR_BATCH_WAIT_MS:-10}"
      - --silence-commit-ms
      - "${ASR_LOCAL_SILENCE_COMMIT_MS:-750}"
      - --force-refresh-ms
      - "${ASR_LOCAL_FORCE_REFRESH_MS:-1000}"
      - --silence-rms-threshold
      - "${ASR_LOCAL_SILENCE_RMS_THRESHOLD:-0.006}"
      - --max-request-audio-seconds
      - "${ASR_LOCAL_STREAM_WINDOW_SECONDS:-20}"
      - --unfixed-chunk-num
      - "2"
      - --unfixed-token-num
      - "${ASR_STREAM_UNFIXED_TOKEN_NUM:-64}"
      - --chunk-size-sec
      - "1.0"
      - --stream-context-chars
      - "${QWEN3_ASR_STREAM_CONTEXT_CHARS:-160}"
      - --host
      - 0.0.0.0
      - --port
      - "7118"
    volumes:
      - ./scripts/run_qwen3_asr.py:/opt/hr-agent/run_qwen3_asr.py:ro
      - qwen_hf_cache:/root/.cache/huggingface
      - qwen_vllm_cache:/root/.cache/vllm
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    ports:
      - "127.0.0.1:7118:7118"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7118/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 900s


  qwen3_asr_secondary:
    profiles: ["asr-local"]
    image: qwenllm/qwen3-asr:latest@sha256:fb75b775f089e06e5a1aaebffd421e37505cc630d50c86d889d95ffa45a7e16a
    restart: unless-stopped
    depends_on:
      qwen_embedding:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "16g"
    ipc: host
    gpus:
      - driver: nvidia
        device_ids: ["${QWEN3_ASR_SECONDARY_GPU_DEVICE:-0}"]
        capabilities: [gpu]
    environment:
      <<: *model-download-environment
      NO_PROXY: localhost,127.0.0.1,::1,qwen3_asr,qwen3_asr_secondary,fish_tts
      no_proxy: localhost,127.0.0.1,::1,qwen3_asr,qwen3_asr_secondary,fish_tts
      NVIDIA_VISIBLE_DEVICES: "${QWEN3_ASR_SECONDARY_GPU_DEVICE:-0}"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - python3
      - /opt/hr-agent/run_qwen3_asr.py
      - --asr-model-path
      - Qwen/Qwen3-ASR-1.7B
      - --gpu-memory-utilization
      - "${QWEN3_ASR_GPU_MEMORY_UTILIZATION:-0.17}"
      - --max-model-len
      - "${QWEN3_ASR_MAX_MODEL_LEN:-2048}"
      - --max-num-seqs
      - "${ASR_LOCAL_PREVIEW_MAX_CONCURRENCY:-10}"
      - --max-sessions
      - "${ASR_LOCAL_PREVIEW_MAX_SESSIONS:-16}"
      - --max-new-tokens
      - "${QWEN3_ASR_MAX_NEW_TOKENS:-256}"
      - --soft-window-seconds
      - "${ASR_LOCAL_STREAM_SOFT_WINDOW_SECONDS:-12}"
      - --window-seconds
      - "${ASR_LOCAL_STREAM_WINDOW_SECONDS:-20}"
      - --overlap-seconds
      - "${ASR_LOCAL_STREAM_OVERLAP_SECONDS:-1.5}"
      - --batch-wait-ms
      - "${QWEN3_ASR_BATCH_WAIT_MS:-10}"
      - --silence-commit-ms
      - "${ASR_LOCAL_SILENCE_COMMIT_MS:-750}"
      - --force-refresh-ms
      - "${ASR_LOCAL_FORCE_REFRESH_MS:-1000}"
      - --silence-rms-threshold
      - "${ASR_LOCAL_SILENCE_RMS_THRESHOLD:-0.006}"
      - --max-request-audio-seconds
      - "${ASR_LOCAL_STREAM_WINDOW_SECONDS:-20}"
      - --unfixed-chunk-num
      - "2"
      - --unfixed-token-num
      - "${ASR_STREAM_UNFIXED_TOKEN_NUM:-64}"
      - --chunk-size-sec
      - "1.0"
      - --stream-context-chars
      - "${QWEN3_ASR_STREAM_CONTEXT_CHARS:-160}"
      - --host
      - 0.0.0.0
      - --port
      - "7118"
    volumes:
      - ./scripts/run_qwen3_asr.py:/opt/hr-agent/run_qwen3_asr.py:ro
      - qwen_hf_cache:/root/.cache/huggingface
      - qwen_vllm_cache:/root/.cache/vllm
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7118/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 900s

  fish_tts_model_init:
    # Run explicitly before the first Fish TTS deployment or a model revision change.
    profiles: ["model-init"]
    image: 06-fish-tts-vllm-omni:0.24.0-s2-pro
    build: *fish-tts-build
    restart: "no"
    user: "0:0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *model-download-environment
      NO_PROXY: localhost,127.0.0.1,::1,fish_tts
      no_proxy: localhost,127.0.0.1,::1,fish_tts
      HF_HOME: /app/checkpoints/.hf_home
      HF_HUB_CACHE: /app/checkpoints/.hf_home/hub
      XDG_CACHE_HOME: /app/checkpoints/.cache
      TMPDIR: /app/checkpoints/.tmp
      FISH_TTS_MODEL_REPOSITORY: fishaudio/s2-pro
      FISH_TTS_MODEL_REVISION: "${FISH_TTS_MODEL_REVISION:-1de9996b6be38b745688de084d87a5633f714e4e}"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        install -d -m 0755 \
          /app/checkpoints/s2-pro \
          /app/checkpoints/.hf_home/hub \
          /app/checkpoints/.cache \
          /app/checkpoints/.tmp
        ready_marker="/app/checkpoints/s2-pro/.hr-agent-ready-$${FISH_TTS_MODEL_REVISION}"
        required_files=(
          codec.pth
          config.json
          model-00001-of-00002.safetensors
          model-00002-of-00002.safetensors
          model.safetensors.index.json
          tokenizer.json
        )
        model_complete=1
        [ -f "$${ready_marker}" ] || model_complete=0
        for filename in "$${required_files[@]}"; do
          [ -s "/app/checkpoints/s2-pro/$${filename}" ] || model_complete=0
        done
        if [ "$${model_complete}" -ne 1 ]; then
          echo "Downloading pinned Fish Audio S2-Pro checkpoint..."
          hf download "$${FISH_TTS_MODEL_REPOSITORY}" \
            --revision "$${FISH_TTS_MODEL_REVISION}" \
            --local-dir /app/checkpoints/s2-pro
          for filename in "$${required_files[@]}"; do
            test -s "/app/checkpoints/s2-pro/$${filename}"
          done
          printf '%s\n' "$${FISH_TTS_MODEL_REVISION}" > "$${ready_marker}"
          chown -R 1000:1000 /app/checkpoints/s2-pro
        fi
        chown 1000:1000 /app/checkpoints
        echo "Fish Audio S2-Pro checkpoint is ready."
    volumes:
      - fish_tts_checkpoints:/app/checkpoints
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      disable: true

  fish_tts:
    image: 06-fish-tts-vllm-omni:0.24.0-s2-pro
    build: *fish-tts-build
    profiles: ["tts"]
    restart: unless-stopped
    stop_grace_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "16g"
    ipc: host
    gpus:
      - driver: nvidia
        device_ids: ["${FISH_TTS_GPU_DEVICE:-1}"]
        capabilities: [gpu]
    environment:
      <<: [*host-proxy-environment, *tls-client-environment]
      NO_PROXY: localhost,127.0.0.1,::1,fish_tts
      no_proxy: localhost,127.0.0.1,::1,fish_tts
      NVIDIA_VISIBLE_DEVICES: "${FISH_TTS_GPU_DEVICE:-1}"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # Persist generated TorchInductor/Triton kernels across container recreations.
      # Keep the path versioned so runtime upgrades cannot reuse incompatible code.
      TORCHINDUCTOR_CACHE_DIR: /var/cache/fish-tts/torch-2.11.0-cu130-vllm-omni-0.24.0-fast-ar-v1
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_OMNI_FISH_KVCACHE_ATTN: required
      FISH_TTS_MODEL_PATH: /app/checkpoints/s2-pro
      SPEAKER_SAMPLES_DIR: /app/speakers
      # The derived image patches the v0.24.0 Fish CUDA graph warmup metadata path.
      FISH_TTS_DEPLOY_CONFIG: /app/config/fish_s2_pro_dynamic_batch.yaml
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        required_files=(
          codec.pth
          config.json
          model-00001-of-00002.safetensors
          model-00002-of-00002.safetensors
          model.safetensors.index.json
          tokenizer.json
        )
        for filename in "$${required_files[@]}"; do
          if [ ! -s "$${FISH_TTS_MODEL_PATH}/$${filename}" ]; then
            echo "Fish Audio checkpoint file is missing: $${filename}" >&2
            exit 1
          fi
        done
        python3 -c "import vllm_omni; from fish_speech.models.dac import modded_dac, rvq"
        python3 -c "from vllm_omni.attention import fish_kvcache_attn as f; assert f.is_available(), f.load_error()"
        exec vllm serve "$${FISH_TTS_MODEL_PATH}" \
          --omni \
          --host 0.0.0.0 \
          --port 8091 \
          --deploy-config "$${FISH_TTS_DEPLOY_CONFIG}"
    volumes:
      - fish_tts_checkpoints:/app/checkpoints:ro
      - fish_tts_speakers:/app/speakers
      - fish_tts_compile_cache:/var/cache/fish-tts
      - ./fish_tts/config/fish_s2_pro_dynamic_batch.yaml:/app/config/fish_s2_pro_dynamic_batch.yaml:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    ports:
      - "127.0.0.1:7119:8091"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8091/health
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 900s

  signoz_collection_agent:
    image: otel/opentelemetry-collector-contrib:0.139.0
    restart: unless-stopped
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      DEPLOYMENT_ENVIRONMENT: "${ENVIRONMENT:-local}"
      SIGNOZ_OTLP_HTTP_ENDPOINT: http://signoz-ingester:4318
    networks:
      - default
      - signoz
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
