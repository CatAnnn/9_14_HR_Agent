  # check, so the host autoheal service cannot restart a long KB sync.
  kb_sync:
    image: "${HR_AGENT_BACKEND_IMAGE:-06-emotion-main-backend:local}"
    profiles: ["maintenance"]
    restart: "no"
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - backend/config/.env
    depends_on:
      postgres:
        condition: service_healthy
      backend_migrate:
        condition: service_completed_successfully
      local_model_controller:
        condition: service_healthy
      qwen_embedding:
        condition: service_started
        required: false
    environment:
      <<: [*host-proxy-environment, *postgres-client-environment]
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal,postgres,local_model_controller,qwen_embedding
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal,postgres,local_model_controller,qwen_embedding
      LOCAL_MODEL_CONTROLLER_URL: http://local_model_controller:7120
    volumes:
      - ./backend:/app/backend:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
    entrypoint: ["python", "scripts/sync_vectorstore.py"]
    command: []
    healthcheck:
      disable: true

