        HTTP_PROXY: http://host.docker.internal:3128
        HTTPS_PROXY: http://host.docker.internal:3128
        NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal
    environment:
      APP_RUNTIME_MODE: "${APP_RUNTIME_MODE:-production}"
      FRONTEND_HTTPS_HOST: "${FRONTEND_HTTPS_HOST:-sgh-c-00589.sgh.apac.bosch.com}"
      FRONTEND_HTTPS_PORT: "${FRONTEND_HTTPS_PORT:-7443}"
      WORKFLOW_PAGE_GUIDE_ENABLED: "${WORKFLOW_PAGE_GUIDE_ENABLED:-true}"
      WORKFLOW_PAGE_GUIDE_ALWAYS_SHOW: "${WORKFLOW_PAGE_GUIDE_ALWAYS_SHOW:-false}"
      AGENT_INTRODUCTION_VARIANT: "${AGENT_INTRODUCTION_VARIANT:-classic}"
      NGINX_ENVSUBST_FILTER: "^(APP_RUNTIME_MODE|FRONTEND_HTTPS_HOST|FRONTEND_HTTPS_PORT|WORKFLOW_PAGE_GUIDE_ENABLED|WORKFLOW_PAGE_GUIDE_ALWAYS_SHOW|AGENT_INTRODUCTION_VARIANT)$"
    ports:
      - "${FRONTEND_HTTP_PORT:-7110}:7070"
      - "${FRONTEND_HTTPS_PORT:-7443}:7443"
    volumes:
      - frontend_tls_certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -r /etc/nginx/certs/server.crt
          && test -r /etc/nginx/certs/server.key
          && wget --no-check-certificate -qO- https://127.0.0.1:7443/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend_autoscaler:
    image: "${HR_AGENT_BACKEND_IMAGE:-06-emotion-main-backend:local}"
    # The project checkout is an NFS-mounted 0700 directory. Container root is
    # root-squashed there, so use the owning host identity and add only the
    # Docker socket group required by the restricted Engine adapter.
    user: "1956470149:1956470149"
    group_add:
      - "${DOCKER_SOCKET_GID:-999}"
    restart: unless-stopped
    # Reconciliation can be waiting for Compose/Docker readiness. Give the
    # sidecar enough time to finish or cancel cleanly during deployments.
    stop_grace_period: 420s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOME: /tmp
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-06-emotion-main}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      BACKEND_AUTOSCALER_MIN_REPLICAS: "${BACKEND_AUTOSCALER_MIN_REPLICAS:-2}"
      BACKEND_AUTOSCALER_MAX_REPLICAS: "${BACKEND_AUTOSCALER_MAX_REPLICAS:-8}"
      BACKEND_AUTOSCALER_TARGET_USERS_PER_REPLICA: "${BACKEND_AUTOSCALER_TARGET_USERS_PER_REPLICA:-8}"
      BACKEND_AUTOSCALER_SPARE_REPLICAS: "${BACKEND_AUTOSCALER_SPARE_REPLICAS:-1}"
      BACKEND_AUTOSCALER_ACTIVE_WINDOW_SECONDS: "${BACKEND_AUTOSCALER_ACTIVE_WINDOW_SECONDS:-300}"
      BACKEND_AUTOSCALER_POLL_SECONDS: "${BACKEND_AUTOSCALER_POLL_SECONDS:-10}"
      BACKEND_AUTOSCALER_SCALE_DOWN_STABILIZATION_SECONDS: "${BACKEND_AUTOSCALER_SCALE_DOWN_STABILIZATION_SECONDS:-900}"
      BACKEND_AUTOSCALER_SCALE_DOWN_COOLDOWN_SECONDS: "${BACKEND_AUTOSCALER_SCALE_DOWN_COOLDOWN_SECONDS:-300}"
      BACKEND_AUTOSCALER_SCALE_DOWN_MIN_IDLE_SECONDS: "${BACKEND_AUTOSCALER_SCALE_DOWN_MIN_IDLE_SECONDS:-30}"
      BACKEND_AUTOSCALER_START_HEALTH_TIMEOUT_SECONDS: "${BACKEND_AUTOSCALER_START_HEALTH_TIMEOUT_SECONDS:-120}"
      BACKEND_AUTOSCALER_START_HEALTH_POLL_SECONDS: "${BACKEND_AUTOSCALER_START_HEALTH_POLL_SECONDS:-1}"
      BACKEND_AUTOSCALER_SCALE_DOWN_PROBE_INTERVAL_SECONDS: "${BACKEND_AUTOSCALER_SCALE_DOWN_PROBE_INTERVAL_SECONDS:-1}"
      BACKEND_AUTOSCALER_STOP_TIMEOUT_SECONDS: "${BACKEND_AUTOSCALER_STOP_TIMEOUT_SECONDS:-300}"
      BACKEND_AUTOSCALER_RECONCILE_LEASE_SECONDS: "${BACKEND_AUTOSCALER_RECONCILE_LEASE_SECONDS:-1500}"
      BACKEND_AUTOSCALER_WATCHDOG_STALE_SECONDS: "${BACKEND_AUTOSCALER_WATCHDOG_STALE_SECONDS:-30}"
      BACKEND_AUTOSCALER_COMPOSE_WORKING_DIR: /home/uay4sgh/hr_agent/06_emotion
      BACKEND_AUTOSCALER_COMPOSE_CONFIG_FILES: /home/uay4sgh/hr_agent/06_emotion/docker-compose.yml
      BACKEND_AUTOSCALER_COMPOSE_ENV_FILE: /home/uay4sgh/hr_agent/06_emotion/backend/config/.env
      BACKEND_AUTOSCALER_DOCKER_CLI_PATH: /usr/bin/docker
      BACKEND_AUTOSCALER_DOCKER_SOCKET_PATH: /var/run/docker.sock
    command: >
      uvicorn backend.services.backend_autoscaler:app
      --host 0.0.0.0 --port 7122
    expose:
      - "7122"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
      - .:/home/uay4sgh/hr_agent/06_emotion:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7122/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

