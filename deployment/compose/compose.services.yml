    environment:
      <<: *postgres-client-environment
    volumes:
      - ./data:/app/data
    command:
      - sh
      - -c
      - >-
        if [ -f data/employee_database/employees.xlsx ]; then
          python scripts/import_employees.py data/employee_database/employees.xlsx --exact --quiet;
        else
          echo 'employees.xlsx not found, skip employee import';
        fi

