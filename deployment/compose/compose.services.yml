      - "4317"
      - "4318"
      - "13133"
    security_opt:
      - no-new-privileges:true

  local_model_controller:
    image: "${HR_AGENT_BACKEND_IMAGE:-06-emotion-main-backend:local}"
    restart: unless-stopped
    environment:
      <<: *otel-exporter-environment
      # The controller only uses the Docker Engine API. Keeping it CPU-only
      # prevents an NVML issue from blocking all backend replicas at startup.
      HR_AGENT_GPU_METRICS_ENABLED: "false"
      LOCAL_MODEL_DOCKER_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-06-emotion-main}"
      LOCAL_MODEL_DOCKER_SOCKET_PATH: /var/run/docker.sock
      LOCAL_MODEL_STOP_TIMEOUT_SECONDS: "${LOCAL_MODEL_STOP_TIMEOUT_SECONDS:-30}"
      OTEL_SERVICE_NAME: hr-agent-local-model-controller
    command: >
      opentelemetry-instrument uvicorn backend.services.local_model_runtime_controller:app
      --host 0.0.0.0 --port 7120
    expose:
      - "7120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
