# company_values
version: v0.2
name: company_values
enabled: true
company_name: "Bosch"

culture_name:
  en: "Our High Performance Culture in China"
  zh: "我们的中国区高绩效文化"

values:
  - id: collaboration_to_deliver
    name: "Collaboration to DELIVER"
    name_zh: "协同共进"
    definition: "Collaborate across teams, proactively share information and resources, take ownership of shared goals, and work together to solve problems and achieve joint success."
    desired_behaviors:
      - "Proactively share information and resources to break down departmental silos."
      - "When a project hits a bottleneck, immediately align relevant stakeholders to solve the problem rather than shifting blame or waiting."
      - "Take ownership of shared goals, and proactively support upstream and downstream tasks while completing your own."
      - "Promote and appreciate joint success, and win as a team."
    desired_behaviors_zh:
      - "主动共享信息与资源，打破部门墙。"
      - "在项目遇到瓶颈时，第一时间拉通相关方共同解决问题，而非推诿或等待。"
      - "对团队共同目标负责，个人任务完成中主动支援上下游。"
      - "促进并珍视共同成功，团队制胜。"
    anti_patterns: []
    manager_applications: []
    source_refs:
      - "Our High Performance Culture in China"

  - id: innovation_to_shape
    name: "Innovation to SHAPE"
    name_zh: "创变未来"
    definition: "Continuously challenge existing processes and solutions, introduce new technologies and cross-disciplinary approaches, and validate innovation rapidly through iteration and business results."
    desired_behaviors:
      - "Never settle for existing processes or solutions—proactively ask, 'Is there a better way?' Introduce new technologies and cross-disciplinary approaches early in the project."
      - "Tolerate failure but demand rapid validation and fast iteration, and prove the value of innovation through business results."
    desired_behaviors_zh:
      - "不满足于现有流程和方案，主动提出“有没有更好的做法”；在项目早期引入新技术和跨领域思路。"
      - "对失败有容忍度，但要求快速验证、快速迭代，用结果证明创新价值。"
    anti_patterns: []
    manager_applications: []
    source_refs:
      - "Our High Performance Culture in China"

  - id: customer_centricity_to_grow
    name: "Customer-centricity to GROW"
    name_zh: "聚力共赢"
    definition: "Understand customers and users deeply, deliver end-to-end solutions that create value, and enable mutual growth in organizational capability and business."
    desired_behaviors:
      - "Listen actively to customers/users, think from their perspectives, and uncover hidden needs and pain points."
      - "Deliver end-to-end solutions and create value for customers/users."
      - "Grow together with customers/users in both capabilities and business."
    desired_behaviors_zh:
      - "主动聆听客户/用户的声音，站在他们的角度思考，识别与发现深层次的需求与痛点。"
      - "用一体化的能力，推动解决方案的落地，创造价值。"
      - "实现组织能力与业务的共同成长，与客户共赢。"
    anti_patterns: []
    manager_applications: []
    source_refs:
      - "Our High Performance Culture in China"

  - id: commitment_to_win
    name: "Commitment to WIN"
    name_zh: "使命必达"
    definition: "Take ownership of challenging goals, honor commitments on quality, cost and delivery, remain resilient under pressure, act immediately on improvement, and pursue stretch outcomes that enable the company to win."
    desired_behaviors:
      - "Take on tough tasks in competitive projects without retreating."
      - "Honor your commitments on QCD as promised, and be resilient when facing difficulties and proactively develop alternative solutions."
      - "Make no excuses in retrospective meetings; instead, provide improvement plans and execute them at once."
      - "Desire to grow with the company, and rotate based on business demand."
      - "Define 'winning' as outperforming competitors or achieving stretch goals."
    desired_behaviors_zh:
      - "在竞争性项目中主动承担困难任务，不退缩。"
      - "对承诺的质量、成本和交付“说到做到”，即使遇到困难也坚忍不拔并主动寻找备选方案。"
      - "对失败复盘不找借口，而是输出改进计划并立即执行。"
      - "渴望与公司共成长，到业务最需要的地方去。"
      - "将“赢”定义为超越对手/达成挑战目标。"
    anti_patterns: []
    manager_applications: []
    source_refs:
      - "Our High Performance Culture in China"

source_policy:
  authority: company_approved_only
  knowledge_scope: culture
  note: "仅使用公司确认的 Our High Performance Culture in China 内容作为高绩效文化依据；当前配置包含 Collaboration to DELIVER、Innovation to SHAPE、Customer-centricity to GROW 和 Commitment to WIN 四个维度。"
