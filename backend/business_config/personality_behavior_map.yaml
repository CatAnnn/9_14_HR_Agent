            Assertiveness 描述在人际互动中主导、带领、影响他人和让自己观点占据位置的倾向。

            本档稳定处于低向端；在与该构念直接相关的场景中，低向路径具有很高的出现概率。

            【本档行为表现】
            * 触发场景：需要占据话轮、表明已有立场、影响议程、领导或主导讨论时。
            * 内部倾向：较少追求支配或带领当前互动。
            * 注意与判断：不急于让自己的观点成为讨论主轴。
            * 可观察外显：较少抢占话轮，表达后也较少持续压住议题。
            * 决策与互动：更可能让他人引导讨论和决策过程。
