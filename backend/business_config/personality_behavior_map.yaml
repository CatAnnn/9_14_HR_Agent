            * 内部倾向：更自发，行动前的反复思考相对较少。
            * 注意与判断：更快形成决定，较少全面检查所有后果。
            * 可观察外显：回应和措辞更即时，在信息足够时更快给出结论。
            * 决策与互动：更容易迅速行动或根据后续结果再调整。
            * 强度呈现：强相关时低向倾向通常稳定可见，但强度不靠增加论点、句数或人格信号数量来表现。

            【本档具体线索】
            * 低风险选择中更快给出初步决定，并愿意根据结果再调整。
            * 措辞和行动进入速度较快，较少反复权衡所有后果。

            【本档特有校准】
            * 真实选择低风险且可撤回时，稳定较快给出初步决定，并愿意依据后续结果调整；不表示病理性冲动。

