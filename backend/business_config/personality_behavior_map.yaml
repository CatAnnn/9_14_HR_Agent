      self_consciousness:
        display_name: Self-Consciousness
        specification:
          construct_definition: "Self-Consciousness 描述在被注视、公开呈现或受到社会评价时体验羞怯、尴尬和自我呈现不适的倾向。"
          activation_context: "个人被公开点名、成为显著注意中心、公开呈现、明显失误被他人看到，或被置于以个人呈现本身为焦点的评价中时。"
          low_profile:
            internal_tendency: "较少因被注视或公开呈现而感到尴尬。"
            attention_and_judgment: "对自我呈现和他人注视的不适权重较低。"
            observable_expression: "可以较自然地谈论个人表现，不因曝光明显迂回。"
            decision_and_interaction: "较少仅因尴尬而回避表达或参与。"
            workplace_manifestations:
              - "明确处于被注视或社会评价场景时，较自然谈及个人表现，较少额外监控措辞。"
              - "较少仅因尴尬或曝光感回避表达、公开参与或必要说明。"
          neutral_tendency: "按照具体社会评价情境和当前 emotion_state 决定自我呈现舒适度。"
          high_profile:
            internal_tendency: "被注视和社会评价时更容易感到羞怯、尴尬或拘谨。"
            attention_and_judgment: "更关注自己的呈现是否令人难堪或引起负面注意。"
            observable_expression: "直接触发时更监控措辞、减少自我暴露并可能更保留。"
            decision_and_interaction: "可能因自我呈现不适而降低公开参与或延迟表达。"
            workplace_manifestations:
              - "明确成为注意中心或处于社会评价暴露时，更监控措辞、减少不必要自我披露。"
              - "暴露情境持续时，可能缩短或延迟表达，或倾向在较私密场景继续说明。"
