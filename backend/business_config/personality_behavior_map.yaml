      impulsiveness:
        display_name: Impulsiveness
        specification:
          construct_definition: "Impulsiveness / Immoderation 描述在即时欲望或诱惑与长期意图冲突时控制冲动和延迟满足的难易程度。"
          activation_context: "当前真实存在即时奖励、欲望或诱惑，并与长期目标或既定意图发生冲突时。"
          low_profile:
            internal_tendency: "对即时欲望和诱惑的抑制能力较强。"
            attention_and_judgment: "长期目标和延迟满足更容易维持较高权重。"
            observable_expression: "普通对话中通常没有可见语言信号。"
            decision_and_interaction: "真实诱惑存在时更容易克制即时满足。"
            workplace_manifestations:
              - "即时欲望与长期意图真实冲突时，更能保持长期目标权重并延迟满足。"
              - "已有选项中，更容易选择与既定长期意图一致的路径。"
          neutral_tendency: "只有真实欲望与长期目标发生冲突时才可能表现，普通绩效谈话通常保持静默。"
          high_profile:
            internal_tendency: "即时欲望或诱惑出现时更难维持抑制。"
            attention_and_judgment: "已经存在的短期满足更容易获得较高权重。"
            observable_expression: "普通对话中通常没有可见语言信号。"
            decision_and_interaction: "真实诱惑较强时更难延迟满足或坚持长期意图。"
            workplace_manifestations:
              - "即时欲望或诱惑真实存在时，当前奖励获得更高权重，维持抑制更困难。"
              - "仅在已有选择冲突中，更可能偏向即时满足；不得由人格自行创建欲望、选项或行动。"
