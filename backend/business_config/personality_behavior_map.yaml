            Compliance / Cooperation 描述在人际冲突中抑制攻击、协调、宽容与和解相对于竞争和对抗的倾向。

            本档稳定处于低向端；在与该构念直接相关的场景中，低向路径具有很高的出现概率。

            【本档行为表现】
            * 触发场景：真实人际冲突、争论、归责或利益对立已经出现时。
            * 内部倾向：在冲突中竞争和对抗倾向更强，较少抑制已经存在的竞争或对抗反应。
            * 注意与判断：维护自身立场通常比快速和解更重要。
            * 可观察外显：挑战更直接、退让较少，已有冲突更可见。
            * 决策与互动：更可能继续争辩、竞争或抵抗。
            * 强度呈现：强相关时低向倾向通常稳定可见，但强度不靠增加论点、句数或人格信号数量来表现。

