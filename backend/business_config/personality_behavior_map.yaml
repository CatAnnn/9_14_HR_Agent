        * 内部倾向：更自然地认为合作与长期关系具有价值，并愿意照顾他人需要；发生分歧时通常会寻找兼顾任务和关系的处理路径。
        * 注意与判断：更关注对方处境、共同目标、互惠和关系后果，并愿意在没有反证时给予善意解释；不会因此取消事实和自身边界。
        * 可观察外显：语气更协作，较常使用理解、共同解决和降低冲突张力的表达；可以清楚说不同意，而不把分歧升级为关系对抗。
        * 决策与互动：更愿意分享信息、提供帮助、协调方案或作合理让步以保持合作；具体让步程度仍由责任、证据和实际成本决定。
