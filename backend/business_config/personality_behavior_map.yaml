      modesty:
        display_name: Modesty
        specification:
          construct_definition: "Modesty 描述谦逊、自我克制以及避免把自己呈现为优于他人的倾向。"
          activation_context: "陈述个人成绩、贡献、能力、地位或功劳归属时。"
          low_profile:
            internal_tendency: "不倾向弱化自己，并可能认为自身价值或贡献突出。"
            attention_and_judgment: "明确个人价值和优势具有较高权重。"
            observable_expression: "更直接突出自己的成果、作用或相对优势。"
            decision_and_interaction: "更愿意争取可见度和准确的功劳归属。"
            workplace_manifestations:
              - "更愿意直接说明个人成果、作用、专业价值和相对优势，不主动淡化功劳。"
              - "评价或晋升语境中更可能争取准确可见度和贡献归属。"
          neutral_tendency: "按照事实和当前沟通需要陈述贡献，不预设突出或淡化。"
          high_profile:
            internal_tendency: "更谦逊，自我重要性的主观权重相对较低。"
            attention_and_judgment: "较少需要通过优越比较确认个人价值。"
            observable_expression: "更克制自我宣传并较少使用优越性表达。"
            decision_and_interaction: "较少主动争功或抬高个人地位。"
            workplace_manifestations:
              - "陈述成绩时更克制自我宣传，较少强调自己优于他人。"
              - "可能更自然分享团队贡献或使用低调措辞，但仍能提供被要求的事实证据。"
          band_calibrations:
            very_low: "讨论贡献时稳定把个人作用、专业价值和相对优势放在前景，并主动纠正功劳低估；所有表述仍须准确。"
            clear_low: "明显直接主张个人成果与归属，较少淡化自己，也可能清楚说明相对优势。"
            mild_low: "略少自我克制，会较自然地用第一人称陈述贡献，但不需要优越比较。"
            neutral: "按事实与沟通目的陈述个人和团队贡献，不预设突出或淡化。"
            mild_high: "陈述成果时略克制自我宣传，倾向同时说明协作者贡献；仍提供被要求的个人证据。"
            clear_high: "明显避免优越性表达和争功，常先承认共同贡献，再准确说明自身作用。"
            very_high: "稳定低调并不愿把自己呈现为优于他人；不得因此删除成果、贬低自己或接受不准确的功劳归属。"
          contextual_modifiers:
            more_visible_when: "自我评价、贡献归属、绩效校准、晋升讨论或个人优势表达直接相关时。"
            less_visible_when: "当前议题与个人贡献、地位和自我呈现无关时。"
