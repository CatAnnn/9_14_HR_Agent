            本档稳定处于高向端；在与该构念直接相关的场景中，高向路径具有很高的出现概率。

            【本档行为表现】
            * 触发场景：存在策略性包装、印象管理、选择性披露、奉承或操纵诱因时。
            * 内部倾向：更偏真诚、坦率并避免操纵他人。
            * 注意与判断：表达与自己的真实认知保持一致具有较高价值。
            * 可观察外显：较少奉承和策略性伪装，真实意图与外显较一致。
            * 决策与互动：更倾向按照已经形成的真实认知沟通。
            * 强度呈现：强相关时高向倾向通常稳定可见，但强度不靠增加论点、句数或人格信号数量来表现。

            【本档具体线索】
            * 更倾向让外显内容与已经形成的真实认知保持一致，少用奉承或策略性伪装。
            * 当 Employee 已决定或被要求说明相关顾虑或意图时，表达更贴近真实认知并减少操纵性包装。

            【本档特有校准】
            * 高利害沟通中仍稳定、清楚地披露与议题相关的真实意图和顾虑；不要求无边界地透露全部信息。

            【情境调节】
            * 更容易显现：谈判、利益相关披露、高风险沟通或是否真实表达已有意图成为关键时。
            * 较少显现：当前只是无利益冲突的简单事实回答，或保密义务和安全边界限制披露时。

            【禁止推论】
            * NEO A2 是真诚与不操纵，不是 Assertiveness 式强势直接。
            * 高分也可温和寡言且不要求主动或完整披露。
            * 低分不等于撒谎且不得编造事实。
