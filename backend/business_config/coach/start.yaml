version: v1.0
dimension:
  id: opening_and_result_framing
  name: 开场定调与绩效结果对齐
  description: 评估管理者是否在对话开场清晰、直接且建设性地说明绩效结果，并明确实际产出与预期之间的关系。
  review_focus:
  - 是否较早说明本次沟通的核心议题，而不是长时间铺垫或绕圈。
  - 是否明确给出绩效结果或结论。
  - 是否清晰界定实际产出符合、部分符合或不符合预期。
  - 表达基调是否客观、坦诚、建设性，既不回避问题，也不过度严厉或随意。
  - 是否避免“整体还行”“可能有些不足”“你应该明白”等模棱两可的表达。
  observable_evidence:
    positive:
    - 管理者明确说出绩效结果。
    - 管理者将实际产出与明确预期进行直接比较。
    - 管理者说明本次对话接下来要讨论的重点。
    - 员工能够复述结论、确认理解，或围绕核心结论提出针对性问题。
    negative:
    - 开场拖沓，迟迟不说明绩效结果。
    - 只表达模糊感受，没有界定产出是否符合预期。
    - 直接进入任务细节、指责或辩论。
    - 仅问“明白了吗”，但没有让员工表达自己的理解。
    - 基调过度严厉，引发防御；或过度随意，使员工无法意识到问题的重要性。
  score_scale:
    5:
      label: 清晰、直接且完成理解验证
      criteria: 开门见山，直接且建设性地说明绩效结果。清晰界定产出是否符合预期，基调客观、坦诚且不回避问题，让员工第一时间明确本次对话的核心议题。
    4:
      label: 结论清楚，但表达或验证略有不足
      criteria: 能较快切入正题，说明绩效结果及产出与预期的对比，基调较为客观。员工基本能够理解核心结论，但语言精炼度、安全感铺垫或理解验证不够充分，表达略显生硬。
    3:
      label: 提到结果，但界定不够具体
      criteria: 提到了绩效结果，但表述较为含糊、绕圈或不够聚焦。员工能大致理解方向，但对“实际产出是否符合预期”或差距边界仍可能存在疑问，理解验证较弱或缺失。
    2:
      label: 未清晰说明结果与预期关系
      criteria: 开场拖沓、避重就轻或未明确说明绩效结果。没有对产出与预期的关系给出清晰定位，导致员工不清楚后续讨论的重点，或需要依靠猜测理解管理者意图。
    1:
      label: 缺少开场定调或基调严重失当
      criteria: 完全没有开场定调，直接陷入任务细节、指责或对抗；或者基调严重错误，例如过度严厉导致员工强烈防御，或过度随意导致员工不重视此次沟通。
  scoring_constraints:
  - condition: 未明确说明绩效结果
    maximum_score: 2
  - condition: 未明确说明产出是否符合预期
    maximum_score: 3
    
