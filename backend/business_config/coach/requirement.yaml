version: v1.0

dimension:
  id: return_to_output_expectations
  name: 产出与标准
  description: >-
    评估管理者是否能够围绕客观事实、评价标准和工作要求，
    从“目标方向、实际结果、过程行为”三个维度，结合员工既定目标、
    职能级别要求、博世价值观和博世高绩效文化行为，
    对员工产出进行完整、客观且有依据的评估。

  review_focus:
    - 是否围绕客观事实、评价标准和工作要求组织反馈。
    - 是否避免陷入 Task List 中单项任务的对错争辩，而是将讨论提升到目标价值、业务方向和实际结果。
    - 是否从目标方向、实际结果和过程行为三个维度组织反馈，而非只关注其中一个方面。
    - 是否评估目标方向的正确性，即员工的工作是否真正解决了关键客户、业务或战略问题。
    - 是否明确说明实际结果是否符合预期，并指出结果与预期之间的具体差距。
    - 是否使用目标、数据、时间、项目、业务影响或可验证产出支持结果判断。
    - 是否将结果与员工既定目标、岗位责任及职能级别要求进行对标。
    - 是否从知识、创新、影响和沟通等方面判断产出是否达到对应职能级别的要求。
    - 是否通过历史表现对比，判断员工是否在解决更困难的问题，以及相比上一周期是否取得实质性突破。
    - 是否基于可观察的过程行为进行评价，并说明其与博世高绩效文化行为或博世价值观的关系。
    - 是否清晰区分事实、影响、评价标准和管理者判断，避免使用人格标签或主观定性替代证据。

  observable_evidence:
    positive:
      - 管理者主动避免纠缠单项任务的对错，而是回到目标价值、业务方向和最终结果。
      - 反馈按照目标方向、实际结果、过程行为三个层面展开，结构清晰。
      - 管理者首先说明员工的工作在解决谁的什么问题，以及该问题与战略、客户或业务价值的关系。
      - 管理者明确指出哪些结果符合预期，哪些结果尚未达到预期。
      - 管理者引用具体目标、数据、时间、项目、产出、业务影响或行为实例支持判断。
      - 管理者将员工结果与既定目标、岗位责任或职能级别要求进行对标。
      - 管理者从知识、创新、影响和沟通等方面解释员工产出是否达到对应级别标准。
      - 管理者通过历史对比说明员工是否解决了更困难的问题，以及相比上一周期是否形成实质性突破。
      - 管理者使用可观察行为分析员工在协作、担当、执行、反馈或问题解决方面的表现。
      - 管理者将过程行为与博世高绩效文化行为或博世价值观建立清晰联系。
      - 员工能够理解评价依据来自既定目标、职级标准和行为标准，而不是管理者个人好恶。

    negative:
      - 讨论长期停留在 Task List 中某项任务由谁负责、谁对谁错。
      - 只罗列完成或未完成的任务，没有讨论任务背后的客户价值、业务价值或战略方向。
      - 只谈最终结果，不评价目标方向和过程行为。
      - 只谈行为态度，不说明实际结果和业务影响。
      - 只谈战略或方向，不说明员工实际交付是否达到预期。
      - 使用“你不够主动”“你能力不行”“你态度有问题”等人格化或主观标签。
      - 给出结论但没有具体例子、数据、项目或业务影响作为支持。
      - 没有说明实际结果与预期结果之间的具体差距。
      - 没有引用员工目标、岗位责任、职能级别要求或既定行为标准。
      - 仅凭管理者主观感觉判断员工表现，没有进行有效对标。
      - 没有进行历史对比，无法判断员工是否取得了突破或承担了更困难的问题。
      - 将博世价值观或高绩效文化作为口号使用，没有对应到具体可观察行为。
      - 评价结论与事实例子之间缺乏清晰的逻辑联系，员工难以理解或信服。

  score_scale:
    5:
      label: 完成全面精准的三维度评估
      criteria: >-
        管理者能够清晰围绕事实、标准和工作要求组织反馈，
        并有效规避 Task List 层面的对错纠缠。

        对员工产出的评估全面、精准且逻辑严密，完整覆盖以下三个维度：

        1. 目标方向：
           优先引导员工思考“正在解决谁的什么问题”，清晰判断工作方向是否对齐关键客户需求、
           业务价值或战略目标，而不是仅评价任务是否完成。

        2. 实际结果：
           明确给出结果是否符合预期的判断，并使用具体、可验证的差距例子支持结论。
           能够结合员工既定目标和职能级别要求，从知识、创新、影响和沟通等方面进行精准对标，
           判断产出是否达到对应级别标准。
           同时能够进行历史对比，清晰说明员工是否在解决更困难的问题，
           以及相比上一周期是否取得实质性突破。

        3. 过程行为：
           使用具体、可观察的行为证据，对员工在目标推进、协作、担当、执行或问题解决过程中的表现进行分析，
           并与博世高绩效文化行为或博世价值观建立深入、准确的联系。

        整体反馈事实充分、标准明确、逻辑闭环，能够清晰区分事实、影响、标准和管理者判断，
        使员工能够理解并信服评价依据。

    4:
      label: 事实和标准较清楚，但某一维度深度或证据略有不足
      criteria: >-
        管理者能够围绕事实和标准展开讨论，基本避免陷入 Task List 的对错争辩，
        并能够给出明确的评价结论和具体差距例子。

        对目标方向、实际结果和过程行为三个维度有较好覆盖，
        也能够结合员工目标、职能级别要求、博世价值观或博世高绩效文化行为进行明确对标。

        但存在以下一种或少量不足：
        - 某一维度的分析深度不足；
        - 某些结论的证据不够充分；
        - 历史对比或突破性判断不够清晰；
        - 事实、影响、标准和判断之间的逻辑连接略有欠缺。

        员工整体能够理解评价依据，但部分结论仍需要进一步说明。

    3:
      label: 基本讨论产出，但维度覆盖或评价依据不完整
      criteria: >-
        管理者基本能够围绕产出和工作要求进行讨论，并给出一定的评价结论，
        但仍可能不自觉地陷入 Task List 的任务细节或对错争论。

        虽然提供了部分例子，但例子不够具体、有力或可验证，
        部分评价仍主要依赖管理者的主观感受。

        目标方向、实际结果和过程行为三个维度覆盖不完整，例如：
        - 只谈结果，不谈过程行为；
        - 只谈行为，不谈实际结果；
        - 只谈任务完成情况，不谈客户价值、业务价值或战略方向。

        对员工目标、职能级别要求、高绩效行为标准或博世价值观的引用不足，
        历史对比和突破性判断也不充分。

    2:
      label: 评价主观模糊且缺乏标准
      criteria: >-
        讨论深陷 Task List 的任务细节、责任归属或对错拉扯，
        未能将讨论提升到客户价值、业务价值或战略方向。

        对员工产出的评价主观、模糊，缺乏具体事实、结果差距和清晰的三维度分析。
        没有有效结合员工目标、职能级别要求或历史表现进行对标。

        对过程行为的评价缺乏可观察证据，
        可能使用主观标签替代行为描述，
        也没有与博世高绩效文化行为或博世价值观建立有效联系。

        员工难以理解评价标准，也难以信服管理者的判断。

    1:
      label: 未能基于事实和标准进行评价
      criteria: >-
        讨论完全停留在 Task List 的任务对错、责任归属和细节争论中，
        没有讨论目标价值、业务方向、实际结果或过程行为。

        对员工产出没有明确标准，也没有任何有效的目标、职级、历史表现或行为依据，
        评价主要依赖主观臆断、人格判断、权威压制或情绪化结论。

  scoring_constraints:
    - condition: 核心评价结论没有任何具体事实、数据、项目、结果或行为例子支持
      maximum_score: 2

    - condition: 没有明确说明实际结果是否符合预期，或没有指出实际结果与预期之间的差距
      maximum_score: 3

    - condition: 目标方向、实际结果、过程行为三个维度中只覆盖一个维度
      maximum_score: 3

    - condition: 完全没有讨论工作所解决的客户、业务或战略问题，只围绕任务是否完成进行评价
      maximum_score: 3

    - condition: 没有结合员工目标、岗位责任或职能级别要求进行任何对标
      maximum_score: 3

    - condition: 对结果突破性的判断没有任何历史表现或上一周期对比依据
      maximum_score: 4

    - condition: 提及博世价值观或高绩效文化，但没有对应到具体可观察行为
      maximum_score: 4

    - condition: 使用人格标签、能力标签或态度标签替代可观察行为证据
      maximum_score: 2

    - condition: 讨论主要陷入 Task List 的任务对错或责任归属争辩，未回到价值、方向和结果
      maximum_score: 2

    - condition: 评价主要依赖管理者主观感觉，没有清晰区分事实、影响、标准和判断
      maximum_score: 2