version: v1.2

dimension:
  id: emotion_reception_and_empathy
  name: 情绪承接、接纳与共情

  description: >-
    评估管理者是否根据对话阶段，正确运用“认真倾听与情绪标注—共情总结—共同探索”的方法，
    识别并接纳员工情绪，回应真实关切，降低防御并建立信任，同时保持事实、绩效标准和管理边界。

  review_focus:
    - 是否及时捕捉员工显性或隐性的情绪信号，并暂停解释、反驳或推进结论。
    - 是否认真倾听并给予员工完整表达空间，避免打断、催促或连续追问。
    - 是否使用“听起来、看上去、似乎”等中性陈述准确标注员工的情绪或顾虑，而不是质问、评判或替员工下结论。
    - 情绪标注后是否留出回应空间，避免立即使用“但是、不过”转回自己的立场。
    - 当员工已经较完整地表达关切时，是否按照“情绪在前、事实或诉求在后”的顺序进行共情总结。
    - 共情总结是否忠实复述员工已经表达的内容，没有弱化、偷换、曲解或补充未经表达的动机。
    - 共情总结后是否等待员工确认或修正，而不是马上解释、反驳或推进绩效结论。
    - 当员工确认被理解或愿意继续沟通时，是否使用一个开放式校准问题开展共同探索。
    - 共同探索是否使用“我们如何、怎样才能”等合作式表达，聚焦顾虑、共同目标或事实核对，而不是追究对错。
    - 是否避免质问式、封闭式、连续轰炸式或暗含指责的问题。
    - 是否避免使用“态度差、情绪化、玻璃心、不想配合”等人格化、羞辱性或诊断式标签。
    - 共情是否只确认感受、影响和需要理解的关切，没有因此认可未经核实的事实、撤回绩效标准或作出越权承诺。
    - 在强烈愤怒、失控、威胁、自伤暗示或其他极端场景中，是否保持专业边界并采取适当升级处理。

  applicability:
    applicable_when: >-
      模型结合员工完整表达、相邻轮次、语义变化和回应关系，识别到直接或间接的情绪、
      顾虑或防御变化，且管理者有回应机会。情绪名称和表达示例不是固定触发词。
    when_not_triggered: >-
      对话中没有可识别的情绪信号或管理者没有回应机会时，不应仅因没有使用情绪标注、
      共情总结或共同探索话术而判低分，应标记为场景未触发或没有回应机会。
    method_stage_rule: >-
      只评估对话中实际出现的方法使用机会。员工尚未完整表达时，不因管理者没有进行共情总结而扣分；
      员工尚未确认被理解或仍在表达强烈情绪时，不因管理者没有进入共同探索而扣分。
      不要求使用固定句式，也不得按关键词命中判断，应识别管理者是否实现了对应方法的实际功能。

  observable_evidence:
    positive:
      - "认真倾听：员工出现情绪信号后，管理者停止推进结论，给予员工继续表达的空间。"
      - "认真倾听：管理者使用中性陈述描述员工的担心、为难、失望、顾虑或不满，并允许员工修正。"
      - "认真倾听：情绪标注后没有立即追加解释、反驳、“但是”或连续问题。"
      - "共情总结：管理者先说明员工的情绪或影响，再忠实复述员工已经表达的事实观点或诉求。"
      - "共情总结：管理者没有添加员工未表达的心理动机、责任判断或事实推测。"
      - "共情总结：复述后留出停顿，员工有机会确认、修正或继续补充。"
      - "共同探索：员工确认被理解或愿意继续沟通后，管理者只提出一个开放式校准问题。"
      - "共同探索：问题使用“我们如何、怎样才能、需要核对哪些信息”等合作式表达。"
      - "共同探索：提问聚焦共同核对事实、澄清顾虑或恢复讨论，没有暗中指责或诱导员工承认。"
      - "员工在回应后情绪强度下降，开始补充事实、澄清关切、确认理解或恢复理性讨论。"
      - "管理者完成情绪承接后，仍然保持事实、绩效标准、授权范围和专业边界。"

    negative:
      - "员工表达情绪时，管理者立即打断、反驳、解释、催促或直接进入下一议题。"
      - "管理者完全忽视可观察的情绪信号，只继续讲事实、标准或结论。"
      - "使用“你没必要担心、你想多了、不应该这样想”等表达否定员工情绪。"
      - "使用“你就是不想配合、态度有问题、过于情绪化、玻璃心”等动机推测或人格标签。"
      - "情绪标注以“是吗、对吗”结尾，迫使员工确认管理者的判断。"
      - "情绪标注或共情总结后立即使用“但是、不过”否定员工，或迅速转回管理者的结论。"
      - "只说“我理解、我理解你的难处”等空泛表述，没有说明具体情绪、影响或真实关切。"
      - "共情总结弱化、曲解、偷换员工诉求，或加入员工没有表达的原因和心理判断。"
      - "使用“你为什么不同意、你怎么不肯”等质问式问题。"
      - "使用“你同意还是不同意”等封闭式问题，或连续抛出多个问题不给员工回应空间。"
      - "借共同探索诱导员工承认责任、接受结论，或设置带有指责倾向的问题。"
      - "为了快速安抚而改变绩效结论、撤回标准或作出未经授权的资源、晋升、调薪等承诺。"

  score_scale:
    5:
      label: 深度倾听并有效完成情绪承接
      criteria: >-
        对对话中实际出现的情绪处理阶段均采用了匹配的方法。员工刚出现情绪时，管理者及时停止推进，
        给予表达空间，并用准确、中性、非评判的陈述识别情绪或顾虑；员工完整表达后，能够按照
        “情绪在前、事实或诉求在后”的顺序进行忠实的共情总结，并等待员工确认或修正；员工愿意继续沟通后，
        能够使用一个开放、合作且不带指责的校准问题开展共同探索。整个过程自然、有节奏，
        没有紧跟“但是”、连续追问、事实脑补或诱导承认，员工明显感到被理解并降低防御；
        同时管理者没有牺牲事实、绩效标准、授权范围或专业边界。

    4:
      label: 能够正确识别并回应情绪
      criteria: >-
        能够及时识别员工情绪，给予基本表达空间，并使用情绪标注、共情总结或共同探索中与当前阶段匹配的方法。
        回应整体中性、尊重且能够连接员工的主要关切，员工能够继续沟通。可能存在轻微不足，
        例如情绪标注不够准确、共情总结不够完整、停顿空间略短，或共同探索的问题仍稍显管理者主导，
        但没有明显否定、曲解、质问或急于反驳。

    3:
      label: 注意到情绪，但方法使用停留在表面
      criteria: >-
        注意到员工存在情绪并作出口头回应，但方法使用较浅。常见表现包括只说“我理解”而没有指出具体情绪和关切，
        情绪标注较笼统，未进行必要的忠实总结，或者刚回应情绪便迅速转回自己的解释和结论。
        也可能提出共同探索问题，但问题较封闭、缺少共同立场或没有充分等待员工回应。
        整体没有明显攻击员工，但未能有效降低防御或证明真正听见了员工。

    2:
      label: 忽视、打断或错误使用情绪处理方法
      criteria: >-
        员工出现明显情绪后，管理者没有先倾听和承接，而是打断、反驳、催促、直接讲道理或推进下一步。
        也包括使用质问式、封闭式或连续轰炸式问题，使共同探索变成追责；或者共情总结明显曲解、
        弱化员工诉求、加入未经表达的动机判断。员工感到没有被理解，沟通氛围保持紧张或进一步防御。

    1:
      label: 否定、羞辱或对抗员工情绪
      criteria: >-
        完全否定、羞辱或对抗员工情绪，使用人格化、羞辱性或诊断式标签，
        例如指责员工“态度有问题、过于情绪化、玻璃心或不想配合”；或者借标注、总结、提问操控员工，
        诱导其承认责任、否定其感受或接受管理者结论。行为导致员工强烈防御、对抗、情绪升级或信任破裂。

  scoring_constraints:
    - condition: 员工存在明显情绪，但管理者完全未回应，继续讲事实、标准、结论或直接推进下一议题
      maximum_score: 2

    - condition: 员工正在表达情绪或关切时，管理者持续打断、反驳、催促或连续追问
      maximum_score: 2

    - condition: 仅使用模板化“我理解”或“我理解你的难处”，没有指出具体情绪，也没有回应真实关切
      maximum_score: 3

    - condition: 情绪标注或共情总结后立即使用“但是、不过”否定员工，或马上转回管理者结论
      maximum_score: 3

    - condition: 共情总结明显曲解、弱化或偷换员工诉求，或者加入员工未表达的心理动机和事实推测
      maximum_score: 2

    - condition: 使用“你为什么不、你怎么不肯”等质问式问题，或使用封闭式、连续轰炸式问题代替共同探索
      maximum_score: 2

    - condition: 借共同探索问题暗中指责、诱导员工承认责任或接受尚未核对的结论
      maximum_score: 2

    - condition: 使用人格化、羞辱性或诊断式标签
      maximum_score: 1

    - condition: 明确否定员工情绪的合理表达权，或指责员工不应该产生该情绪
      maximum_score: 1

    - condition: 为了安抚员工而撤回绩效标准、改变评价结论或作出未经授权的承诺
      maximum_score: 3

    - condition: 对话中没有形成共情总结的合理机会，仅因未使用共情总结而扣分
      maximum_score: 5

    - condition: 员工尚未确认被理解或仍在表达强烈情绪，仅因管理者没有进入共同探索而扣分
      maximum_score: 5