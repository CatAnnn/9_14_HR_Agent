  emotion_evaluation:
    enabled: true
    rerank_instruction: >-
      Rank passages that provide explicit criteria for evaluating the manager's listening, empathy, de-escalation and joint exploration of employee emotion. Prefer concrete imperative steps, checklists, rules, examples and observable conversation behavior. Downrank chapter or book summaries, introductions, FBI or hostage stories, historical narratives, personality descriptions, generic feedback doctrine and emotion-dismissive passages such as advice that the manager does not need to comfort or understand emotion.
    rerank_query_template: >-
      评估{{ intent.name if intent else '' }}绩效沟通中经理对员工情绪的主动倾听、战术同理心、标注或镜像、开放式校准问题、共同澄清或共同解决；核心关注：{{ motivation.primary_motive_id if motivation else '' }}；当前情绪锚点：{{ emotion_state.current_anchor_id if emotion_state else '' }}{% if supplemental_info %}；本轮补充背景：{{ supplemental_info[:400] }}{% endif %}。寻找具体的情绪承接评价标准和适用文化行为依据。
    rerank_candidate_top_n: 18
    rerank_top_n: 8
    citation_scope_minimums: {culture: 1, emotion: 2}
