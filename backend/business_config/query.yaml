  development_plan_evaluation:
    enabled: true
    rerank_instruction: >-
      Rank passages that provide explicit criteria for evaluating the manager's summary and tailored development or improvement plan. Prefer applicable job-level, the complete official five-part Career Elements framework, action, verification and follow-up standards over generic best practices. When current or next job-level labels are supplied, prefer passages that explicitly cover those exact labels and downrank unrelated level systems. When supplemental context names a culture value, prefer the passage that explicitly defines that exact value rather than a different culture value. When Career Elements are listed as already held, treat them only as exclusions from new-development targets.
