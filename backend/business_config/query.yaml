      weight: 1.0
    - template: >-
        {% set current_level = normalized_employee_level %}
        {{ profile.role if profile else '' }} {{ current_level }} 岗位标准 job level 当前职级要求 结果 能力 行为
      scopes: [job_level]
      weight: 1.2
    - template: "Performance Review Feedback 方向价值 结果差距 可观察行为"
